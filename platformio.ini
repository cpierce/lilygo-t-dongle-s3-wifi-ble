; LilyGO T-Dongle-S3 -- Wi-Fi / BLE survey display
;
; Build:    pio run
; Flash:    pio run -t upload        (plug the dongle in first)
; Monitor:  pio device monitor       (JSON scan log, 115200 baud)
; Test:     pio test -e native       (unit tests of lib/survey on this machine)
; Lint:     pio check
;
; If the picture is upside down for the way you hold it, change
; -DSCREEN_ROTATION=1 to 3 and reflash.

[platformio]
default_envs = t-dongle-s3

[env:t-dongle-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder

; LilyGO documents the T-Dongle-S3 as 16 MB flash, no PSRAM. The devkitc-1
; profile assumes 8 MB and the default_8MB partition table; this app needs
; well under 2 MB, so that is safe on any revision of the board.

build_flags =
    ; Native USB: Serial goes out the USB-A plug as a CDC port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

    ; App settings
    -DSCREEN_ROTATION=1

    ; ---- TFT_eSPI configuration for the 0.96" 80x160 ST7735 ----
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DST7735_DRIVER=1
    ; Required on ESP32-S3: without it TFT_eSPI derives a null SPI register base and crashes in init().
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=80
    -DTFT_HEIGHT=160
    -DST7735_GREENTAB160x80=1
    -DTFT_MISO=-1
    -DTFT_MOSI=3
    -DTFT_SCLK=5
    -DTFT_CS=4
    -DTFT_DC=2
    -DTFT_RST=1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=LOW
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=27000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^2.5.1

; The unit tests run on the host (env:native), not on the dongle.
test_ignore = *

; Lint:     pio check
; Only analyse our own code; TFT_eSPI and the framework are not ours to fix.
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/survey/>
; cppcheck sees one file at a time here, so its unused-function check cannot
; tell that lib/survey is called from src/ and test/; it is disabled.
check_flags =
    cppcheck: --inline-suppr --suppress=unusedFunction --suppress=*:*/.pio/libdeps/*

; Recovery path: flash over the ESP32-S3's built-in USB JTAG with OpenOCD,
; bypassing the serial bootloader. Use when the serial upload cannot connect:
;   pio run -e t-dongle-s3-jtag -t upload
[env:t-dongle-s3-jtag]
extends = env:t-dongle-s3
upload_protocol = esp-builtin

; Unit tests for lib/survey, built and run on this machine with Unity:
;   pio test -e native
; The library has no Arduino dependency, which is what makes this possible.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
